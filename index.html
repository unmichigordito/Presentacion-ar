<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
  
  <!-- Precarga de recursos con crossorigin anónimo -->
  <a-assets>
    <img id="foto-perfil" src="felino.jpg" crossorigin="anonymous">
  </a-assets>

  <!-- Marcador personalizado -->
  <a-marker type="pattern" url="pattern-LUFFY.patt">
    
    <!-- Base / Fondo de la Tarjeta -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="3" height="1.8" color="#0F172A" material="transparent: true; opacity: 0.9">
      
      <!-- Foto del Felino -->
      <a-image src="#foto-perfil" position="-0.8 0 0.05" width="1" height="1"></a-image>

      <!-- Textos -->
      <a-text value="Tu Nombre y Apellido" position="0.0 0.35 0.05" scale="0.5 0.5 0.5" color="#FFFFFF" font="kelsonsans"></a-text>
      <a-text value="Estudiante de Informatica" position="0.0 0.05 0.05" scale="0.35 0.35 0.35" color="#38BDF8" font="kelsonsans"></a-text>
      <a-text value="Tel: +52 123 456 7890" position="0.0 -0.25 0.05" scale="0.3 0.3 0.3" color="#CBD5E1" font="kelsonsans"></a-text>

    </a-plane>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
