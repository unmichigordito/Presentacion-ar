<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Carta de Presentación AR</title>
    <!-- Librerías de WebAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Precarga de recursos multimedia -->
      <a-assets>
        <img id="foto-perfil" src="felino.jpg" crossorigin="anonymous">
        <!-- Imagen de fondo que subirás -->
        <img id="foto-fondo" src="luffyfondo.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- Marcador personalizado (Barbablanca / Whitebeard) -->
      <a-marker type="pattern" url="pattern-WHITEBEARD.patt">
        
        <!-- Base de la tarjeta con la imagen de fondo cargada -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="2.2" height="1.4" src="#foto-fondo" color="#FFFFFF">
          
          <!-- LADO IZQUIERDO: Foto de perfil -->
          <a-image src="#foto-perfil" position="-0.6 0 0.02" width="0.7" height="0.7"></a-image>

          <!-- LADO DERECHO: Información de contacto y experiencia -->
          <a-text value="Erick Rodriguez Hernandez" position="0.0 0.45 0.02" scale="0.35 0.35 0.35" color="#FFFFFF"></a-text>
          
          <a-text value="Estudiante de Informatica" position="0.0 0.25 0.02" scale="0.25 0.25 0.25" color="#38BDF8"></a-text>
          
          <!-- Sección de Experiencia -->
          <a-text value="Experiencia:" position="0.0 0.05 0.02" scale="0.22 0.22 0.22" color="#F1F5F9"></a-text>
          <a-text value="- Vigilancia\n- Trabajo en lacteos\n- Exp. basica en redes y hardware" position="0.0 -0.18 0.02" scale="0.18 0.18 0.18" color="#CBD5E1"></a-text>

          <!-- Teléfono -->
          <a-text value="Tel: +25 492 105 99 88" position="0.0 -0.45 0.02" scale="0.22 0.22 0.22" color="#38BDF8"></a-text>

        </a-plane>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
